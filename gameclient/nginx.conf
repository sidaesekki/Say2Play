# 빌드 결과물을 서빙하고 /api, /ws는 같은 출처로 mainserver에 넘긴다.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://mainserver:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # STOMP 엔드포인트는 /ws 하나다.
    location /ws {
        proxy_pass http://mainserver:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # 음성 인식 서버(aiserver/voice_server.py)는 MLX라서 도커가 아닌 맥에서 직접 실행한다. /stt 접두사는 떼고 넘긴다.
    location /stt/ {
        proxy_pass http://host.docker.internal:8002/;
        client_max_body_size 2m;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }

    # index.html은 매번 서버에 확인해 새 빌드가 바로 반영되게 한다. JS/CSS는 파일 이름에 해시가 있어 캐시해도 된다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
